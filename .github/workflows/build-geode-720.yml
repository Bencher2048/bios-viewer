name: Build Geode 720 FPS

on:
  push:
    branches:
      - geode-720-build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Geode Android Launcher
        uses: actions/checkout@v4
        with:
          repository: geode-sdk/android-launcher
          ref: latency-test
          path: geode

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: geode/**/*.gradle*

      - name: Patch max framerate to 720
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("geode/app/src/main/java/com/geode/launcher/preferences/SettingsActivity.kt")
          s = p.read_text(encoding="utf-8")

          pattern = r'''        val maxFrameRate = remember \{\n.*?\n        \}\n\n        SettingsFPSCard'''
          replacement = '        val maxFrameRate = remember { 720 }\n\n        SettingsFPSCard'

          out, count = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"Patch failed: matched {count} blocks")

          p.write_text(out, encoding="utf-8")
          print("Patched:")
          start = out.index("        val maxFrameRate = remember")
          print(out[start:start+200])
          PY


      - name: Disable EGL VSync in non-native pacing path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("geode/app/src/main/java/com/geode/launcher/ExplicitGLSurfaceView.java")
          s = p.read_text(encoding="utf-8")
          marker = "        public int swap() {"
          assert s.count(marker) == 1, "Unexpected EGL swap implementation"
          s = s.replace(marker, "        private boolean mLoggedSwapInterval = false;\n\n" + marker, 1)
          old = "            } else {\n                if (!EGL14.eglSwapBuffers(mEglDisplay, mEglSurface)) {"
          new = "            } else {\n                boolean intervalAccepted = EGL14.eglSwapInterval(mEglDisplay, 0);\n                if (!mLoggedSwapInterval) {\n                    int[] minimum = new int[1];\n                    int[] maximum = new int[1];\n                    EGL14.eglGetConfigAttrib(mEglDisplay, mEglConfig, EGL14.EGL_MIN_SWAP_INTERVAL, minimum, 0);\n                    EGL14.eglGetConfigAttrib(mEglDisplay, mEglConfig, EGL14.EGL_MAX_SWAP_INTERVAL, maximum, 0);\n                    Log.i(\"GeodeFPS\", \"EGL VSync-off request: accepted=\" + intervalAccepted\n                            + \", minSwapInterval=\" + minimum[0] + \", maxSwapInterval=\" + maximum[0]);\n                    mLoggedSwapInterval = true;\n                }\n                if (!EGL14.eglSwapBuffers(mEglDisplay, mEglSurface)) {"
          assert s.count(old) == 1, "Unexpected EGL swap path"
          s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")
          print("Patched EGL VSync-off path with GeodeFPS diagnostics")
          PY

      - name: Build installable debug APK
        shell: bash
        run: |
          cd geode
          chmod +x ./gradlew
          ./gradlew app:assembleStandardDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: geode-720fps-vsync-off-apk
          path: geode/app/build/outputs/apk/standard/debug/app-standard-universal-debug.apk
          if-no-files-found: error
